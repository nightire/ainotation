packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@changesets/cli': 3.0.2
  '@modelcontextprotocol/sdk': 1.30.0
  '@storybook/web-components-vite': 10.6.0
  '@types/node': 24.13.3
  '@vitest/browser-playwright': 4.1.10
  idb: 8.0.3
  lit: 3.3.3
  lucide: 1.42.0
  playwright: 1.63.0
  storybook: 10.6.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.10
  zod: 4.5.4

overrides:
  vite@*: 'catalog:'

# Vite+ uses its own package version for the Vite-compatible core.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
