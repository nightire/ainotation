name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: 0.2.9
          node-version: 24.21.0
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - id: plan
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2 (Changesets 3)

  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: 0.2.9
          node-version: 24.21.0
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

  publish:
    needs: plan
    # Enable after the initial authenticated publish and per-package npm OIDC setup.
    if: needs.plan.outputs.mode == 'publish' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: 0.2.9
          node-version: 24.21.0
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - run: vp run build:packages
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run release
          create-github-releases: true
          push-git-tags: true
