name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Linux services and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: 0.2.9
          node-version: 24.21.0
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
          cache: false
      - name: Install browser for integration tests
        run: pnpm --dir packages/sdk exec playwright install --with-deps chrome
      - name: Build package entry points for a clean checkout
        run: vp run build:packages
      - run: vp check && vp run typecheck
      - run: vp run @ainotation/schema#test && vp run @ainotation/mcp#test && vp run @ainotation/vite#test
      - run: vp run build
      - name: Verify publishable tarballs and installed consumers
        run: vp run release:check

  browser:
    name: Browser interactions and capture
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: 0.2.9
          node-version: 24.21.0
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
          cache: false
      - run: pnpm --dir packages/sdk exec playwright install chrome
      - run: vp run build:packages
      - run: vp run @ainotation/sdk#test && vp run @ainotation/playground#test
